---
name: Promote stable
# Retag an already-built image by digest. No rebuild.
# Typical flow: promote :dev → :0.x.y and optionally :stable after hardware
# validation. Matches PRODUCT_SPEC §13.3.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing published tag to promote (e.g. dev)
        required: true
        default: "dev"
        type: string
      version:
        description: Version tag to apply to the same digest (e.g. 0.2.0)
        required: true
        default: "0.2.0"
        type: string
      also_tag_stable:
        description: Also point :stable at the same digest
        required: true
        default: true
        type: boolean

env:
  IMAGE_NAME: arcalium-os-nvidia
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.source_tag }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote image tags
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          set -euox pipefail
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "SOURCE_TAG=${{ inputs.source_tag }}" >> "${GITHUB_ENV}"
          echo "VERSION=${{ inputs.version }}" >> "${GITHUB_ENV}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install skopeo
        run: |
          set -euox pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Resolve source digest and retag
        id: retag
        env:
          ALSO_STABLE: ${{ inputs.also_tag_stable }}
        run: |
          set -euox pipefail

          REF="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          SRC="${REF}:${SOURCE_TAG}"

          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${SRC}")"
          SRC_BY_DIGEST="${REF}@${DIGEST}"

          echo "Promoting ${SRC_BY_DIGEST}"
          echo "  → ${REF}:${VERSION}"

          skopeo copy \
            "docker://${SRC_BY_DIGEST}" \
            "docker://${REF}:${VERSION}"

          if [[ "${ALSO_STABLE}" == "true" ]]; then
            echo "  → ${REF}:stable"
            skopeo copy \
              "docker://${SRC_BY_DIGEST}" \
              "docker://${REF}:stable"
          fi

          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "source=${SRC}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.3'

      - name: Sign container image
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.retag.outputs.digest }}
        run: |
          set -euox pipefail
          cosign sign -y --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Summary
        run: |
          {
            echo "## Promoted"
            echo ""
            echo "- Source: \`${{ steps.retag.outputs.source }}\`"
            echo "- Digest: \`${{ steps.retag.outputs.digest }}\`"
            echo "- Version tag: \`${{ inputs.version }}\`"
            echo "- Also :stable: \`${{ inputs.also_tag_stable }}\`"
            echo ""
            echo "Verify:"
            echo "\`\`\`"
            echo "cosign verify --key cosign.pub ghcr.io/kaal22/arcalium-os-nvidia:${{ inputs.version }}"
            echo "\`\`\`"
          } >> "${GITHUB_STEP_SUMMARY}"
