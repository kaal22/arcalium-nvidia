# Anaconda profile for the Arcalium live installer.
# Match os_id = bazzite because the payload still inherits Bazzite's /etc/os-release.
# Without this file Anaconda exits immediately and the Install button does nothing.

[Profile]
profile_id = bazzite

[Profile Detection]
os_id = bazzite

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[User Interface]
hidden_webui_pages =
    network

[Localization]
use_geolocation = False
