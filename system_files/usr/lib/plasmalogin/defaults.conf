# Distro defaults for plasma-login-manager (Plasma 6 replacement for SDDM).
# User choices in System Settings land in /etc/plasmalogin.conf and win over this file.
#
# Bazzite currently uses WallpaperPlugin + file:// URIs. We set both Plugin keys and
# file:// Image paths so the greeter cannot fall back to stock backgrounds.

[Greeter]
WallpaperPluginId=org.kde.image
WallpaperPlugin=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/arcalium-wallpaper.png
PreviewImage=file:///usr/share/wallpapers/arcalium-wallpaper.png
