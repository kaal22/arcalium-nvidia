# Distro defaults for plasma-login-manager (the Plasma 6.7 replacement for
# SDDM, which is what draws the login screen here). Settings chosen by the user
# in System Settings land in /etc/plasmalogin.conf and win over this file.
#
# Group nesting matches WallpaperIntegration: [Greeter] -> Wallpaper ->
# <plugin id> -> the plugin's own config group, which is General for
# org.kde.image.

[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=/usr/share/wallpapers/arcalium-wallpaper.png
PreviewImage=/usr/share/wallpapers/arcalium-wallpaper.png
