[package]
name = "arcalium-control-centre"
version = "0.1.0"
description = "Arcalium Control Centre — Overview MVP"
authors = ["Arcalium"]
edition = "2021"

[lib]
name = "arcalium_control_centre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png lets us set the window icon at runtime. Bundling is disabled
# (--no-bundle), so bundle.icon never reaches the running window on Linux.
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
